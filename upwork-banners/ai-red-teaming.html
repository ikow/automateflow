<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1.0" />
  <title>AI Red Teaming Banner</title>
  <style>
    :root { --bg:#0a0e1a; --orange:#f97316; --orange-soft:#fdba74; --text:#fff7ed; --muted:#d4b896; --line:rgba(249,115,22,0.22); }
    * { box-sizing:border-box; }
    html,body { margin:0; width:1200px; height:630px; overflow:hidden; font-family:-apple-system,system-ui,'Segoe UI',sans-serif; background:radial-gradient(circle at 80% -10%,rgba(249,115,22,0.22),transparent 40%),radial-gradient(circle at 10% 120%,rgba(249,115,22,0.12),transparent 45%),var(--bg); color:var(--text); }
    .banner { position:relative; width:100%; height:100%; padding:36px 44px 96px; background:linear-gradient(145deg,rgba(13,19,35,0.96),rgba(8,12,23,0.96)); border:1px solid rgba(249,115,22,0.16); }
    .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(148,163,184,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,0.06) 1px,transparent 1px); background-size:42px 42px; mask-image:radial-gradient(circle at 40% 45%,black 35%,transparent 90%); pointer-events:none; }
    .logo { display:inline-flex; align-items:center; justify-content:center; width:62px; height:62px; border-radius:14px; border:1px solid rgba(253,186,116,0.6); background:linear-gradient(160deg,rgba(249,115,22,0.28),rgba(8,18,36,0.65)); color:#fed7aa; font-size:28px; font-weight:750; box-shadow:0 0 30px rgba(249,115,22,0.25),inset 0 0 20px rgba(249,115,22,0.2); }
    h1 { margin:56px 0 14px; font-size:62px; line-height:1.05; letter-spacing:-0.02em; max-width:700px; }
    .subtitle { max-width:760px; margin:0; font-size:29px; line-height:1.3; color:var(--muted); }
    .attack-list { position:absolute; right:54px; top:140px; display:flex; flex-direction:column; gap:12px; }
    .attack-item { padding:14px 22px; border-radius:10px; border:1px solid rgba(249,115,22,0.3); background:rgba(249,115,22,0.08); font-size:19px; font-weight:600; color:#fed7aa; display:flex; align-items:center; gap:10px; }
    .attack-item .icon { font-size:22px; }
    .credential-bar { position:absolute; left:44px; right:44px; bottom:28px; display:flex; align-items:center; justify-content:space-between; gap:14px; background:linear-gradient(90deg,rgba(15,27,52,0.92),rgba(12,18,34,0.92)); border:1px solid var(--line); border-radius:13px; padding:13px 16px; }
    .chip { flex:1; text-align:center; font-size:22px; font-weight:600; color:#fed7aa; border-right:1px solid rgba(148,163,184,0.24); }
    .chip:last-child { border-right:0; }
    .signature { position:absolute; right:50px; bottom:82px; font-size:17px; color:#c09060; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="grid"></div>
    <div class="logo">QD</div>
    <h1>AI Red Teaming</h1>
    <p class="subtitle">Adversarial testing for LLMs, agents, and copilots</p>
    <div class="attack-list">
      <div class="attack-item"><span class="icon">⚡</span> Prompt Injection</div>
      <div class="attack-item"><span class="icon">🔓</span> Data Exfiltration</div>
      <div class="attack-item"><span class="icon">🎭</span> Agent Hijacking</div>
      <div class="attack-item"><span class="icon">🛡️</span> Guardrail Bypass</div>
      <div class="attack-item"><span class="icon">🔗</span> Tool/Plugin Exploits</div>
    </div>
    <div class="signature">Qi Deng | AI Security Researcher</div>
    <div class="credential-bar">
      <div class="chip">Ex-Palo Alto Networks</div>
      <div class="chip">Black Hat Speaker</div>
      <div class="chip">25+ CVEs</div>
      <div class="chip">8 US Patents</div>
    </div>
  </div>
</body>
</html>
