<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1.0" />
  <title>Expert Security Consultation Banner</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --blue: #3b82f6;
      --blue-soft: #93c5fd;
      --text: #e7f1ff;
      --muted: #9eb7df;
      --line: rgba(59, 130, 246, 0.24);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 80% -15%, rgba(59,130,246,0.3), transparent 40%),
                  radial-gradient(circle at 10% 100%, rgba(59,130,246,0.16), transparent 45%),
                  var(--bg);
      color: var(--text);
    }

    .banner {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 36px 44px 96px;
      background: linear-gradient(130deg, rgba(12, 18, 35, 0.96), rgba(8, 12, 22, 0.95));
      border: 1px solid rgba(59,130,246,0.15);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148,163,184,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,0.08) 1px, transparent 1px);
      background-size: 38px 38px;
      opacity: 0.6;
      pointer-events: none;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 14px;
      border: 1px solid rgba(96,165,250,0.6);
      background: linear-gradient(160deg, rgba(59,130,246,0.28), rgba(8,18,36,0.7));
      color: #dbeafe;
      font-size: 28px;
      font-weight: 750;
      box-shadow: 0 0 28px rgba(59,130,246,0.24), inset 0 0 16px rgba(59,130,246,0.2);
    }

    h1 {
      margin: 72px 0 12px;
      font-size: 62px;
      line-height: 1.04;
      letter-spacing: -0.02em;
      max-width: 790px;
    }

    .subtitle {
      margin: 0;
      font-size: 31px;
      color: var(--muted);
      max-width: 840px;
    }

    .icons {
      position: absolute;
      right: 54px;
      top: 170px;
      display: flex;
      gap: 18px;
    }

    .icon-wrap {
      width: 112px;
      height: 112px;
      border-radius: 18px;
      border: 1px solid rgba(96, 165, 250, 0.36);
      background: linear-gradient(165deg, rgba(59,130,246,0.22), rgba(9,16,30,0.86));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 24px rgba(59,130,246,0.12);
    }

    .icon {
      width: 66px;
      height: 66px;
      stroke: var(--blue-soft);
      stroke-width: 2.4;
      fill: none;
    }

    .credential-bar {
      position: absolute;
      left: 44px;
      right: 44px;
      bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: linear-gradient(90deg, rgba(15, 27, 52, 0.92), rgba(12, 18, 34, 0.92));
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 13px 16px;
    }

    .chip {
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      color: #dbeafe;
      border-right: 1px solid rgba(148, 163, 184, 0.24);
    }

    .chip:last-child { border-right: 0; }

    .signature {
      position: absolute;
      right: 50px;
      bottom: 82px;
      font-size: 17px;
      color: #8aa6d5;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="grid"></div>

    <div class="logo">QD</div>

    <h1>Expert Security Consultation</h1>
    <p class="subtitle">AI Security &bull; Threat Hunting &bull; Architecture Review</p>

    <div class="icons" aria-hidden="true">
      <div class="icon-wrap">
        <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 12C21 12 12 20 12 32C12 43 21 52 32 52C43 52 52 43 52 32C52 20 43 12 32 12Z"/>
          <path d="M20 32H44M32 20V44"/>
          <path d="M24 24C26 27 30 29 32 32C34 35 38 37 40 40"/>
        </svg>
      </div>
      <div class="icon-wrap">
        <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="29" cy="29" r="14"/>
          <path d="M39 39L51 51" stroke-linecap="round"/>
          <path d="M22 29H36M29 22V36"/>
        </svg>
      </div>
      <div class="icon-wrap">
        <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 8L50 15V29C50 42 42 51 32 56C22 51 14 42 14 29V15L32 8Z"/>
          <path d="M24 31L30 37L41 25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="signature">Qi Deng | AI Security Researcher</div>

    <div class="credential-bar">
      <div class="chip">Ex-Palo Alto Networks</div>
      <div class="chip">Black Hat Speaker</div>
      <div class="chip">25+ CVEs</div>
      <div class="chip">8 US Patents</div>
    </div>
  </div>
</body>
</html>
