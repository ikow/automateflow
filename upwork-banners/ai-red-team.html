<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1.0" />
  <title>AI Red Team Engagement Banner</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --blue: #3b82f6;
      --red: #ef4444;
      --text: #eaf1ff;
      --muted: #a8bbdc;
      --line: rgba(59,130,246,0.23);
      --line-red: rgba(239,68,68,0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 82% -10%, rgba(59,130,246,0.24), transparent 42%),
                  radial-gradient(circle at 20% 115%, rgba(239,68,68,0.2), transparent 45%),
                  var(--bg);
      color: var(--text);
    }

    .banner {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 36px 44px 96px;
      background: linear-gradient(140deg, rgba(12,18,34,0.96), rgba(9,12,22,0.96));
      border: 1px solid rgba(59,130,246,0.15);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148,163,184,0.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,0.075) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.62;
      pointer-events: none;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 14px;
      border: 1px solid rgba(96,165,250,0.6);
      background: linear-gradient(160deg, rgba(59,130,246,0.28), rgba(18,10,24,0.7));
      color: #dbeafe;
      font-size: 28px;
      font-weight: 750;
      box-shadow: 0 0 28px rgba(59,130,246,0.24), inset 0 0 16px rgba(239,68,68,0.12);
    }

    h1 {
      margin: 72px 0 12px;
      font-size: 64px;
      line-height: 1.03;
      letter-spacing: -0.02em;
      max-width: 760px;
    }

    .subtitle {
      margin: 0;
      font-size: 31px;
      color: var(--muted);
      max-width: 820px;
    }

    .attack-graph {
      position: absolute;
      right: 48px;
      top: 144px;
      width: 420px;
      height: 270px;
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,0.22);
      background:
        linear-gradient(140deg, rgba(59,130,246,0.14), rgba(239,68,68,0.1)),
        rgba(9,15,30,0.65);
      box-shadow: inset 0 0 36px rgba(59,130,246,0.11), inset 0 0 36px rgba(239,68,68,0.1);
      overflow: hidden;
    }

    .attack-graph svg {
      width: 100%;
      height: 100%;
      opacity: 0.95;
    }

    .credential-bar {
      position: absolute;
      left: 44px;
      right: 44px;
      bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, rgba(24, 22, 37, 0.92), rgba(11, 18, 34, 0.92));
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 13px;
      padding: 15px 18px;
      font-size: 25px;
      font-weight: 600;
      color: #dbeafe;
      text-align: center;
      letter-spacing: 0.01em;
      box-shadow: inset 0 0 16px rgba(239,68,68,0.08);
    }

    .signature {
      position: absolute;
      right: 50px;
      bottom: 82px;
      font-size: 17px;
      color: #95abcf;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="grid"></div>

    <div class="logo">QD</div>

    <h1>AI Red Team Engagement</h1>
    <p class="subtitle">Adversarial testing for LLM-powered applications</p>

    <div class="attack-graph" aria-hidden="true">
      <svg viewBox="0 0 420 270" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5">
          <path d="M38 52H128L186 98H262L332 54"/>
          <path d="M80 132H152L210 168H294L364 128"/>
          <path d="M52 212H120L198 198H274L344 220"/>
        </g>
        <g stroke="#ef4444" stroke-opacity="0.7" stroke-width="1.6">
          <path d="M332 54L294 128L262 98"/>
          <path d="M364 128L344 220L294 128"/>
          <path d="M210 168L198 198L152 132"/>
        </g>
        <g fill="#93c5fd">
          <circle cx="38" cy="52" r="5"/>
          <circle cx="128" cy="52" r="5"/>
          <circle cx="186" cy="98" r="5"/>
          <circle cx="262" cy="98" r="5"/>
          <circle cx="332" cy="54" r="5"/>
          <circle cx="80" cy="132" r="5"/>
          <circle cx="152" cy="132" r="5"/>
          <circle cx="210" cy="168" r="5"/>
          <circle cx="294" cy="128" r="5"/>
          <circle cx="364" cy="128" r="5"/>
          <circle cx="52" cy="212" r="5"/>
          <circle cx="120" cy="212" r="5"/>
          <circle cx="198" cy="198" r="5"/>
          <circle cx="274" cy="198" r="5"/>
        </g>
        <g fill="#f87171">
          <circle cx="344" cy="220" r="6"/>
          <circle cx="294" cy="128" r="6"/>
          <circle cx="210" cy="168" r="6"/>
        </g>
      </svg>
    </div>

    <div class="signature">Qi Deng | AI Security Researcher</div>

    <div class="credential-bar">Found vulns in OpenAI, Anthropic, Meta, AWS</div>
  </div>
</body>
</html>
