<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1.0" />
  <title>AI Security Assessment Banner</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --bg-soft: #121a2f;
      --blue: #3b82f6;
      --blue-soft: #60a5fa;
      --text: #e5efff;
      --muted: #9cb5de;
      --line: rgba(59, 130, 246, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 80% -10%, rgba(59,130,246,0.25), transparent 40%),
                  radial-gradient(circle at 10% 120%, rgba(59,130,246,0.14), transparent 45%),
                  var(--bg);
      color: var(--text);
    }

    .banner {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 36px 44px 96px;
      background: linear-gradient(145deg, rgba(13, 19, 35, 0.96), rgba(8, 12, 23, 0.96));
      border: 1px solid rgba(59, 130, 246, 0.16);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 40% 45%, black 35%, transparent 90%);
      pointer-events: none;
    }

    .circuit {
      position: absolute;
      right: -80px;
      top: -40px;
      width: 700px;
      height: 500px;
      opacity: 0.42;
      pointer-events: none;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 14px;
      border: 1px solid rgba(96, 165, 250, 0.65);
      background: linear-gradient(160deg, rgba(59,130,246,0.28), rgba(8,18,36,0.65));
      color: #dbeafe;
      font-size: 28px;
      font-weight: 750;
      letter-spacing: 0.5px;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.25), inset 0 0 20px rgba(59,130,246,0.2);
    }

    h1 {
      margin: 72px 0 14px;
      font-size: 66px;
      line-height: 1.03;
      letter-spacing: -0.02em;
      max-width: 760px;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 760px;
      margin: 0;
      font-size: 31px;
      line-height: 1.26;
      color: var(--muted);
    }

    .shield {
      position: absolute;
      right: 94px;
      top: 170px;
      width: 224px;
      height: 224px;
      opacity: 0.9;
      filter: drop-shadow(0 0 26px rgba(59,130,246,0.2));
    }

    .credential-bar {
      position: absolute;
      left: 44px;
      right: 44px;
      bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: linear-gradient(90deg, rgba(15, 27, 52, 0.92), rgba(12, 18, 34, 0.92));
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 13px 16px;
    }

    .chip {
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      color: #dbeafe;
      border-right: 1px solid rgba(148, 163, 184, 0.24);
    }

    .chip:last-child { border-right: 0; }

    .signature {
      position: absolute;
      right: 50px;
      bottom: 82px;
      font-size: 17px;
      color: #8aa6d5;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="grid"></div>

    <svg class="circuit" viewBox="0 0 700 500" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.4">
        <path d="M90 90H260V170H390" />
        <path d="M145 250H290V210H450V135H580" />
        <path d="M230 330H380V270H520V360H640" />
        <path d="M120 420H280V380H470" />
      </g>
      <g fill="#3b82f6" fill-opacity="0.7">
        <circle cx="90" cy="90" r="4" />
        <circle cx="260" cy="170" r="4" />
        <circle cx="390" cy="170" r="4" />
        <circle cx="145" cy="250" r="4" />
        <circle cx="450" cy="135" r="4" />
        <circle cx="580" cy="135" r="4" />
        <circle cx="520" cy="360" r="4" />
        <circle cx="640" cy="360" r="4" />
        <circle cx="470" cy="380" r="4" />
      </g>
    </svg>

    <div class="logo">QD</div>

    <h1>AI Security Assessment</h1>
    <p class="subtitle">Find vulnerabilities in your AI systems before attackers do</p>

    <svg class="shield" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="40" y1="25" x2="170" y2="185" gradientUnits="userSpaceOnUse">
          <stop stop-color="#93c5fd" stop-opacity="0.9"/>
          <stop offset="1" stop-color="#2563eb" stop-opacity="0.5"/>
        </linearGradient>
      </defs>
      <path d="M110 16L182 44V103C182 157 148 191 110 204C72 191 38 157 38 103V44L110 16Z" stroke="url(#g1)" stroke-width="6"/>
      <rect x="88" y="92" width="44" height="39" rx="9" stroke="#93c5fd" stroke-opacity="0.86" stroke-width="5"/>
      <path d="M98 92V80C98 73 103 67 110 67C117 67 122 73 122 80V92" stroke="#93c5fd" stroke-opacity="0.86" stroke-width="5" stroke-linecap="round"/>
    </svg>

    <div class="signature">Qi Deng | AI Security Researcher</div>

    <div class="credential-bar">
      <div class="chip">Ex-Palo Alto Networks</div>
      <div class="chip">Black Hat Speaker</div>
      <div class="chip">25+ CVEs</div>
      <div class="chip">8 US Patents</div>
    </div>
  </div>
</body>
</html>
